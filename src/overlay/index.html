<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>agent-overlay</title>
    <style>
      :root {
        --active: #5b9dff;
        --paused: #ffb340;
        --ask: #ff6b6b;
        --fg: #eef1f7;
        --dim: #808a9e;
        --line: rgba(255, 255, 255, 0.075);
        --line-soft: rgba(255, 255, 255, 0.045);
        --edge: var(--active);
        --glow: rgba(91, 157, 255, 0.55);
      }
      body.state-paused { --edge: var(--paused); --glow: rgba(255, 179, 64, 0.5); }
      body.state-ask { --edge: var(--ask); --glow: rgba(255, 107, 107, 0.6); }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--fg);
        font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------------------------------------------------------- border ----
         The screen edge is the honest indicator: it is on whenever input can
         be injected. It has to be unmissable in peripheral vision without
         being something you want to look away from, so it glows inward from
         the very edge and breathes slowly rather than flashing. */
      #border {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #border::before,
      #border::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #border::before {
        border: 2px solid var(--edge);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
      }
      /* Falls off fast, so the middle of the screen stays completely clear. */
      #border::after {
        box-shadow: inset 0 0 60px -14px var(--glow), inset 0 0 22px -6px var(--glow);
      }
      body.state-active #border,
      body.state-paused #border,
      body.state-ask #border { opacity: 1; }
      body.state-active #border { animation: breathe 3.2s ease-in-out infinite; }
      body.state-ask #border { animation: breathe 1.1s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.62; }
      }

      /* ------------------------------------------------------------ pill ----
         Collapsed it is one glowing blue capsule: "<agent> is using your
         computer - Esc to stop". Click it for the toolbar and the log. */
      /* The window is PAD px larger than the pill on every side so the glow
         is not clipped at the window edge. */
      #pill {
        display: flex;
        flex-direction: column;
        height: calc(100% - 28px);
        margin: 14px;
        background: rgba(12, 18, 34, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(63, 140, 255, 0.3), 0 0 22px rgba(63, 140, 255, 0.8), 0 0 60px rgba(63, 140, 255, 0.35), 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      body.expanded #pill { border-radius: 18px; }
      body.state-paused #pill { box-shadow: 0 0 0 1px rgba(255, 179, 64, 0.35), 0 0 26px rgba(255, 179, 64, 0.65), 0 8px 30px rgba(0, 0, 0, 0.45); }
      body.state-ask #pill { box-shadow: 0 0 0 1px rgba(255, 107, 107, 0.35), 0 0 26px rgba(255, 107, 107, 0.7), 0 8px 30px rgba(0, 0, 0, 0.45); }
      header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 46px;
        padding: 0 20px;
        flex: 0 0 auto;
        cursor: pointer;
        color: #fff;
        font-size: 14px;
        font-weight: 550;
        letter-spacing: 0.005em;
        background: linear-gradient(180deg, rgba(62, 140, 255, 0.62) 0%, rgba(30, 100, 235, 0.62) 100%);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      body.expanded header { border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
      body.state-paused header { background: linear-gradient(180deg, #ffb340 0%, #e0951f 100%); color: #1b1200; text-shadow: none; }
      body.state-ask header { background: linear-gradient(180deg, #ff6b6b 0%, #e04b4b 100%); }
      header .sep { opacity: 0.6; }
      header .hint { opacity: 0.9; font-weight: 500; }
      #tools {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 9px 12px 9px 15px;
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
      }
      body.expanded #tools { display: flex; }

      /* A steady ring pulse reads as "live" at a glance, which a flat dot does not. */
      .dot {
        position: relative;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--edge);
        box-shadow: 0 0 10px var(--glow);
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid var(--edge);
        opacity: 0;
      }
      body.state-active .dot::after { animation: ring 2.4s ease-out infinite; }
      body.state-ask .dot::after { animation: ring 1s ease-out infinite; }
      @keyframes ring {
        0% { transform: scale(0.6); opacity: 0.65; }
        70% { transform: scale(1.5); opacity: 0; }
        100% { opacity: 0; }
      }

      #tools .action {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--dim);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-size: 11.5px;
        flex: 0 0 auto;
        opacity: 0.85;
        letter-spacing: 0.02em;
      }

      button {
        -webkit-app-region: no-drag;
        font: inherit;
        font-size: 12px;
        font-weight: 550;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 9px;
        padding: 5px 11px;
        cursor: pointer;
        transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
      }
      button:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.16); }
      button:active { transform: scale(0.97); }
      button:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; }
      button.stop {
        background: rgba(255, 92, 92, 0.12);
        border-color: rgba(255, 92, 92, 0.28);
        color: #ff9d9d;
      }
      button.stop:hover { background: rgba(255, 92, 92, 0.2); border-color: rgba(255, 92, 92, 0.45); }
      button.primary {
        background: rgba(91, 157, 255, 0.18);
        border-color: rgba(91, 157, 255, 0.42);
        color: #d3e3ff;
      }
      button.primary:hover { background: rgba(91, 157, 255, 0.28); border-color: rgba(91, 157, 255, 0.6); }

      /* ------------------------------------------------------------- log ---- */
      #log {
        flex: 1 1 auto;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        padding: 4px 0 6px;
        -webkit-app-region: no-drag;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
      }
      #log::-webkit-scrollbar { width: 9px; }
      #log::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      #log::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); background-clip: content-box; }

      .entry {
        padding: 7px 15px;
        border-bottom: 1px solid var(--line-soft);
        transition: background 0.12s ease;
      }
      .entry:last-child { border-bottom: 0; }
      .entry:hover { background: rgba(255, 255, 255, 0.025); }
      .entry .top { display: flex; gap: 9px; align-items: baseline; }
      .entry .time {
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        font-size: 10.5px;
        opacity: 0.8;
      }
      .entry .tool {
        font: 600 11.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
        letter-spacing: -0.01em;
      }
      .entry .badge {
        margin-left: auto;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--dim);
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
      }
      .entry.ok .badge { color: #63d89a; background: rgba(99, 216, 154, 0.11); }
      .entry.fail .badge { color: #ff9090; background: rgba(255, 144, 144, 0.13); }
      .entry pre {
        margin: 5px 0 0;
        font: 10.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: var(--dim);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        padding-left: 9px;
        border-left: 2px solid var(--line);
      }
      .empty {
        color: var(--dim);
        padding: 22px 14px;
        text-align: center;
        font-size: 12px;
        opacity: 0.75;
      }

      /* ---------------------------------------------------------- banner ---- */
      #banner {
        flex: 0 0 auto;
        display: none;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        background: linear-gradient(180deg, rgba(255, 179, 64, 0.14), rgba(255, 179, 64, 0.07));
        border-top: 1px solid rgba(255, 179, 64, 0.26);
        box-shadow: inset 3px 0 0 var(--paused);
        -webkit-app-region: no-drag;
      }
      body.state-paused #banner { display: flex; }
      #banner .msg { flex: 1 1 auto; color: #ffd9a0; font-size: 12px; font-weight: 550; }

      /* ----------------------------------------------------------- modal ----
         This is the consent gate. It covers the pill completely so it cannot
         be mistaken for a status line, and the safe choice is not the one
         under the cursor by default. */
      #modal {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(16, 19, 27, 0.985), rgba(10, 12, 17, 0.99));
        padding: 15px;
        -webkit-app-region: no-drag;
      }
      body.state-ask #modal { display: flex; }
      #modal h2 {
        margin: 0 0 3px;
        font-size: 13.5px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      #modal .sub {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 10px;
        line-height: 1.4;
      }
      #modal pre {
        flex: 1 1 auto;
        overflow: auto;
        margin: 0 0 11px;
        padding: 10px 11px;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid var(--line);
        border-radius: 10px;
        font: 11px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: #c9d3e4;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
      }
      #modal .row { display: flex; gap: 8px; }
      #modal .row button { flex: 1 1 auto; padding: 7px 10px; }
    </style>
  </head>
  <body>
    <div id="border"></div>

    <div id="pill" hidden>
      <header id="head" title="Show activity">
        <span class="dot"></span>
        <span id="agent">agent is using your computer</span>
        <span class="sep">&bull;</span>
        <span class="hint" id="hint">Esc to stop</span>
      </header>
      <div id="tools">
        <span class="action" id="action">idle</span>
        <span class="clock" id="clock">0:00</span>
        <button class="stop" id="stop" title="Stop the session (Ctrl+Alt+X)">Stop</button>
      </div>

      <div id="banner">
        <span class="msg" id="pausedMsg">Paused</span>
        <button class="primary" id="resume">Resume</button>
        <button class="stop" id="end">End</button>
      </div>

      <div id="log"></div>

      <div id="modal">
        <h2 id="askTitle">Allow this action?</h2>
        <div class="sub" id="askSub"></div>
        <pre id="askArgs"></pre>
        <div class="row">
          <button class="primary" data-decision="allow">Allow once</button>
          <button data-decision="allow_session">Allow for session</button>
          <button class="stop" data-decision="deny">Deny</button>
        </div>
      </div>
    </div>

    <script>
      const view = new URLSearchParams(location.search).get("view") || "pill";
      const $ = (id) => document.getElementById(id);
      let current = null;
      let expanded = false;

      if (view === "pill") {
        $("border").remove();
        $("pill").hidden = false;
      } else {
        $("pill").remove();
      }

      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }

      function clock(hhmmss) {
        return new Date(hhmmss).toLocaleTimeString();
      }

      function renderLog(log) {
        const el = $("log");
        if (!log.length) {
          el.innerHTML = '<div class="empty">No tool calls yet.</div>';
          return;
        }
        const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.innerHTML = log
          .map((e) => {
            const cls = e.ok === true ? "ok" : e.ok === false ? "fail" : "";
            const badge = e.ok === true ? "done" : e.ok === false ? "failed" : "running";
            return (
              '<div class="entry ' + cls + '">' +
              '<div class="top"><span class="time">' + clock(e.ts) + "</span>" +
              '<span class="tool">' + esc(e.tool) + "</span>" +
              '<span class="badge">' + badge + "</span></div>" +
              "<div>" + esc(e.summary) + "</div>" +
              "<pre>" + esc(JSON.stringify(e.args)) + "</pre>" +
              "</div>"
            );
          })
          .join("");
        if (atBottom) el.scrollTop = el.scrollHeight;
      }

      function esc(s) {
        return String(s === undefined ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }

      function render(s) {
        current = s;
        const cls = !s.active ? "state-idle" : s.prompt ? "state-ask" : s.paused ? "state-paused" : "state-active";
        expanded = !!s.expanded;
        document.body.className = cls + (expanded ? " expanded" : "");
        if (view !== "pill") return;

        $("agent").textContent = s.active ? s.agent + " is using your computer" : s.agent + " is idle";
        $("hint").textContent = s.prompt ? "needs your OK" : s.paused ? "paused" : s.active ? "Esc to stop" : "click for log";
        $("action").textContent = s.paused ? "Paused - " + s.paused : s.current || "waiting";
        $("clock").textContent = fmt(s.elapsed || 0);
        $("pausedMsg").textContent = "Paused: " + (s.paused || "") + ". The agent cannot inject input until you resume.";
        renderLog(s.log || []);

        if (s.prompt) {
          $("askTitle").textContent = "Allow " + s.prompt.tool + "?";
          $("askSub").textContent = s.agent + " wants to be " + s.prompt.summary + ".";
          $("askArgs").textContent = JSON.stringify(s.prompt.args, null, 2);
        }
      }

      // Keep the elapsed clock moving between state pushes.
      setInterval(() => {
        if (view === "pill" && current && current.active) {
          current.elapsed = (current.elapsed || 0) + 1000;
          $("clock").textContent = fmt(current.elapsed);
        }
      }, 1000);

      if (view === "pill") {
        $("stop").onclick = () => window.overlay.send({ t: "stop" });
        $("head").onclick = () => window.overlay.send({ t: "toggle" });
        $("resume").onclick = () => window.overlay.send({ t: "resume" });
        $("end").onclick = () => window.overlay.send({ t: "end" });
        for (const b of document.querySelectorAll("[data-decision]")) {
          b.onclick = () => {
            if (current && current.prompt) {
              window.overlay.send({ t: "decision", id: current.prompt.id, decision: b.dataset.decision });
            }
          };
        }
      }

      window.overlay.onState(render);
      window.overlay.send({ t: "ready" });
    </script>
  </body>
</html>
